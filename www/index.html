<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <title>Shorelark</title>
</head>
<style>
  :root {
    --bg: #1f2639;
    --panel-bg: rgba(59, 70, 100, 0.85);
    --text: #e6e9f0;
    --btn-bg: #3b4664;
    --btn-bg-hover: #4c5a80;
    --viewport-bg: #1f2639;
  }

  body.light {
    --bg: #eef1f8;
    --panel-bg: rgba(255, 255, 255, 0.85);
    --text: #1f2639;
    --btn-bg: #d7dcec;
    --btn-bg-hover: #c2c9e0;
    --viewport-bg: #ffffff;
  }

  body {
    background: var(--bg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  }

  #viewport {
    background: var(--viewport-bg);
  }

  #controls {
    position: absolute;
    top: 0;
    left: 0;
    margin: 15px;
    display: flex;
    gap: 8px;
  }

  #controls button {
    cursor: pointer;
    padding: 6px 12px;
    border: none;
    border-radius: 4px;
    background: var(--btn-bg);
    color: var(--text);
  }

  #controls button:hover {
    background: var(--btn-bg-hover);
  }

  #stats {
    position: absolute;
    top: 0;
    right: 0;
    margin: 15px;
    padding: 10px 14px;
    border-radius: 6px;
    background: var(--panel-bg);
    color: var(--text);
    font-size: 14px;
    line-height: 1.6;
    min-width: 180px;
  }

  #stats span {
    font-weight: bold;
  }

  #chart-container {
    position: absolute;
    bottom: 0;
    right: 0;
    margin: 15px;
    padding: 10px 14px;
    border-radius: 6px;
    background: var(--panel-bg);
    color: var(--text);
    font-size: 12px;
  }

  #chart-legend {
    display: flex;
    gap: 12px;
    margin-bottom: 6px;
  }

  #chart-legend span {
    display: flex;
    align-items: center;
    gap: 4px;
  }

  #chart-legend i {
    display: inline-block;
    width: 10px;
    height: 10px;
    border-radius: 2px;
  }

  #config {
    position: absolute;
    bottom: 0;
    left: 0;
    margin: 15px;
    padding: 10px 14px;
    border-radius: 6px;
    background: var(--panel-bg);
    color: var(--text);
    font-size: 13px;
  }

  #config h4 {
    margin: 0 0 8px 0;
    font-size: 13px;
  }

  #config label {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    margin-bottom: 6px;
  }

  #config input {
    width: 90px;
  }

  #config button {
    cursor: pointer;
    padding: 5px 10px;
    border: none;
    border-radius: 4px;
    background: var(--btn-bg);
    color: var(--text);
    margin-top: 4px;
  }

  #config button:hover {
    background: var(--btn-bg-hover);
  }

  #controls select {
    cursor: pointer;
    padding: 6px 8px;
    border: none;
    border-radius: 4px;
    background: var(--btn-bg);
    color: var(--text);
  }
</style>

<body>
  <canvas id="viewport" width="800" , height="800"></canvas>

  <div id="controls">
    <button id="train">train please, thank u</button>
    <button id="pause">pause</button>
    <button id="reset">reset</button>
    <button id="trails">trails: on</button>
    <button id="theme">🌙 dark</button>
    <select id="speed" title="simulation speed">
      <option value="1">1x</option>
      <option value="2">2x</option>
      <option value="5">5x</option>
      <option value="10">10x</option>
      <option value="25">25x</option>
      <option value="50">50x</option>
    </select>
  </div>

  <div id="stats">
    generation: <span id="stat-generation">0</span><br>
    animals: <span id="stat-animals">-</span><br>
    foods: <span id="stat-foods">-</span><br>
    min fitness: <span id="stat-min">-</span><br>
    max fitness: <span id="stat-max">-</span><br>
    avg fitness: <span id="stat-avg">-</span>
  </div>

  <div id="chart-container">
    <div id="chart-legend">
      <span><i style="background: rgb(255, 99, 99)"></i>max</span>
      <span><i style="background: rgb(255, 220, 99)"></i>avg</span>
      <span><i style="background: rgb(99, 170, 255)"></i>min</span>
    </div>
    <canvas id="chart" width="360" height="140"></canvas>
  </div>

  <div id="config">
    <h4>simulation config</h4>
    <label>animals <input id="cfg-num-animals" type="number" min="1" max="500" step="1" value="40"></label>
    <label>foods <input id="cfg-num-foods" type="number" min="1" max="500" step="1" value="60"></label>
    <label>mutation chance <input id="cfg-mutation-chance" type="number" min="0" max="1" step="0.01" value="0.01"></label>
    <label>mutation coeff <input id="cfg-mutation-coeff" type="number" min="0" max="1" step="0.01" value="0.3"></label>
    <label>max speed <input id="cfg-max-speed" type="number" min="0.001" max="0.05" step="0.001" value="0.005"></label>
    <button id="config-apply">apply &amp; reset</button>
  </div>

  <script src="./bootstrap.js"></script>
</body>

</html>
